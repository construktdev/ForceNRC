name: ForceNRC
version: '${version}'

main: dev.construkter.forceNRC.ForceNRC
api-version: '26.3'
load: POSTWORLD

commands:
  ec:
    description: Exklusiver Befehl für NRC um die Ender Chest überall zu öffnen
    aliases:
      - enderchest

  nrc:
    description: Zeigt den NRC Hinweis

  anvil:
    description: Exklusiver Befehl für NRC um den Amboss überall zu öffnen
    aliases:
      - amboss

  me:
    description: Schaut ob du mit NRC spielst
    aliases:
      - status

  craft:
    description: Exklusiver Befehl für NRC um die Werkbank überall zu öffnen
    aliases:
      - workbench